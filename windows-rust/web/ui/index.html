<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'" />
  <title>Windows SMS Bridge · 短信桥</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
    <span class="blob b4"></span>
    <span class="grain"></span>
  </div>

  <div class="shell">
    <!-- ───────────────────────── title bar ───────────────────────── -->
    <header class="titlebar">
      <div class="brand">
        <span class="logo" id="brandLogo"></span>
        <span class="brand-copy">
          <b>Windows SMS Bridge</b>
          <em class="ver" id="brandVersion">v1.0.0</em>
        </span>
      </div>
      <div class="drag-strip"></div>
      <button class="theme-btn" id="btnTheme" title="切换深浅主题" aria-label="切换主题">
        <svg id="themeIcon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"/></svg>
      </button>
      <div class="win-actions">
        <button class="win-btn" id="btnMin" title="最小化" aria-label="最小化">
          <svg viewBox="0 0 12 12"><path d="M2.5 6h7" /></svg>
        </button>
        <button class="win-btn" id="btnMax" title="最大化" aria-label="最大化">
          <svg viewBox="0 0 12 12"><rect x="2.7" y="2.7" width="6.6" height="6.6" rx="1.4" /></svg>
        </button>
        <button class="win-btn danger" id="btnClose" title="关闭到托盘" aria-label="关闭">
          <svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" /></svg>
        </button>
      </div>
    </header>

    <!-- ───────────────────────── device rail (top level) ───────────────────────── -->
    <div class="device-bar" id="deviceBar">
      <span class="device-label">设备</span>
      <div class="device-chips" id="deviceChips"></div>
      <div class="device-actions">
        <button class="update-btn" id="btnUpdate" hidden title="有新版本可用">
          <svg viewBox="0 0 18 18" class="ic"><path d="M9 2.6v8.8M5.6 8l3.4 3.4L12.4 8"/><path d="M3 13.2v1.4A1.4 1.4 0 0 0 4.4 16h9.2a1.4 1.4 0 0 0 1.4-1.4v-1.4"/></svg>
          <span id="updateLabel">更新</span>
        </button>
        <button class="sync-btn" id="btnSync" title="同步当前设备的短信（Ctrl+R）">
          <svg viewBox="0 0 20 20" class="ic sync-ic"><path d="M16.3 8.4A6.6 6.6 0 0 0 4.6 6.3M3.7 11.6a6.6 6.6 0 0 0 11.7 2.1"/><path d="M16.6 4.2v4.2h-4.2M3.4 15.8v-4.2h4.2"/></svg>
          <span class="sync-label" id="syncLabel">同步</span>
        </button>
        <button class="device-add" id="btnAddDevice" title="配对新手机">
          <svg viewBox="0 0 16 16" class="ic"><path d="M8 3.2v9.6M3.2 8h9.6" /></svg>
          配对手机
        </button>
      </div>
    </div>

    <!-- ───────────────────────── main body ───────────────────────── -->
    <main class="workspace">
      <!-- sidebar -->
      <aside class="panel sidebar">
        <div class="panel-sheen"></div>

        <div class="side-section">
          <div class="side-label">视图</div>
          <nav class="nav" id="navFilters"></nav>
        </div>

        <div class="side-section" id="simSection" hidden>
          <div class="side-label">SIM 卡</div>
          <nav class="nav" id="navSims"></nav>
        </div>

        <div class="side-section">
          <div class="side-label">当前设备</div>
          <div class="side-device" id="sideDevice"></div>
        </div>

        <div class="side-status" id="sideStatus"></div>

        <div class="side-foot">
          <button class="foot-btn" id="btnSettings">
            <svg viewBox="0 0 18 18" class="ic"><circle cx="9" cy="9" r="2.4"/><path d="M9 1.6v2M9 14.4v2M1.6 9h2M14.4 9h2M3.8 3.8l1.4 1.4M12.8 12.8l1.4 1.4M14.2 3.8l-1.4 1.4M5.2 12.8l-1.4 1.4"/></svg>
            设置
          </button>
          <button class="foot-btn" id="btnAbout">
            <svg viewBox="0 0 18 18" class="ic"><circle cx="9" cy="9" r="7"/><path d="M9 8v4.2M9 5.6v.1"/></svg>
            关于
          </button>
        </div>
      </aside>

      <!-- conversation list -->
      <section class="panel list-pane">
        <div class="panel-sheen"></div>

        <div class="list-head">
          <div class="search">
            <svg viewBox="0 0 18 18" class="ic"><circle cx="8" cy="8" r="5.2"/><path d="M11.9 11.9L16 16"/></svg>
            <input id="searchInput" type="text" placeholder="搜索号码或内容" spellcheck="false" />
            <kbd>Ctrl K</kbd>
          </div>

          <div class="list-meta">
            <span id="listMetaText">尚未同步</span>
          </div>
        </div>

        <div class="conv-scroll" id="convScroll">
          <div class="conv-list" id="convList"></div>
          <div class="list-empty" id="listEmpty" hidden></div>
        </div>
      </section>

      <!-- thread -->
      <section class="panel thread-pane" id="threadPane">
        <div class="panel-sheen"></div>
        <div class="thread-empty" id="threadEmpty">
          <div class="orb-illustration" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
          <h2>选择一条会话</h2>
          <p>左侧是手机里的短信，右侧会显示完整对话。<br />所有内容只保存在这台电脑本地。</p>
        </div>

        <div class="thread" id="thread" hidden>
          <header class="thread-head">
            <span class="avatar lg" id="threadAvatar"></span>
            <div class="thread-id">
              <h2 id="threadTitle">—</h2>
              <div class="thread-sub" id="threadSub"></div>
            </div>
            <div class="thread-tools">
              <button class="icon-btn" id="btnCopyNumber" title="复制号码">
                <svg viewBox="0 0 18 18" class="ic"><rect x="6" y="6" width="8.4" height="8.4" rx="2.2"/><path d="M11.4 6V4.6A1.8 1.8 0 0 0 9.6 2.8H4.6A1.8 1.8 0 0 0 2.8 4.6v5a1.8 1.8 0 0 0 1.8 1.8H6"/></svg>
              </button>
              <button class="icon-btn" id="btnExportConv" title="导出为 CSV">
                <svg viewBox="0 0 18 18" class="ic"><path d="M9 2.6v8.8M5.6 8l3.4 3.4L12.4 8"/><path d="M3 13.2v1.4A1.4 1.4 0 0 0 4.4 16h9.2a1.4 1.4 0 0 0 1.4-1.4v-1.4"/></svg>
              </button>
            </div>
          </header>
          <div class="thread-scroll" id="threadScroll">
            <div class="bubbles" id="bubbles"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- ───────────────────────── modals ───────────────────────── -->
  <div class="modal-layer" id="modalLayer" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal glass" id="modalCard" role="dialog" aria-modal="true"></div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script src="../shared/i18n.js"></script>
  <script src="tauri.js"></script>
  <script src="app.js"></script>
</body>
</html>
